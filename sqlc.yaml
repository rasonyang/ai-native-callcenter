version: "2"
sql:
  - engine: postgresql
    schema: internal/store/migrations
    queries: internal/store/sql
    gen:
      go:
        package: queries
        out: internal/store/queries
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        json_tags_case_style: camel
        # docs/design/07-naming.md §2: initialisms are fully capitalized in Go.
        rename:
          ip: "IP"
          url: "URL"
          sip_url: "SIPURL"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              # With an explicit import, type is the bare name: sqlc renders
              # it as <package>.<type> itself.
              type: "UUID"
              import: "github.com/google/uuid"
              pointer: true
