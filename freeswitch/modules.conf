##
## Which FreeSWITCH modules the image compiles. Read by `make` in the source
## tree, one module per line as <category>/<module>.
##
## The doubled ## is not a style choice. FreeSWITCH's configure derives its
## enabled list with `grep -v "#"` and its disabled list with
## `grep "#" | grep -v "##"`, so a single-# comment becomes a phantom entry in
## OUR_DISABLED_MODULES while ## is invisible to both.
##
## This is the list the published v1.11.3 image was built with, kept as
## verified: it is exactly the set the shipped configuration loads, and the
## Dockerfile fails the build if the two ever disagree.
##
## mod_audio_stream is not here. It lives outside the FreeSWITCH tree and is
## built separately by the Dockerfile, from its own repository at its own pin.
##
## The less obvious entries:
##   mod_callcenter    the queue engine; the whole human path depends on it
##   mod_pgsql         how mod_lua and mod_callcenter reach PostgreSQL
##   mod_http_cache    lets record_session write to an http:// store, which is
##                     how recordings leave the switch without a shared volume
##   mod_local_stream  serves music/8000 as moh_stream (queue hold music)
applications/mod_commands
applications/mod_dptools
applications/mod_expr
applications/mod_fifo
applications/mod_hash
applications/mod_voicemail
applications/mod_valet_parking
applications/mod_http_cache
