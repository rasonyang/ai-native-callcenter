services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:18-alpine
    container_name: postgres
    hostname: postgres
    restart: unless-stopped

    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - ./postgres:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

    networks:
      voip-lan:
        ipv4_address: 192.168.31.56


  valkey:
    image: ghcr.io/valkey-io/valkey:9.1.2-alpine
    container_name: valkey
    hostname: valkey
    restart: unless-stopped

    environment:
      TZ: ${TZ}
      VALKEYCLI_AUTH: ${VALKEY_PASSWORD}

    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${VALKEY_PASSWORD}

    volumes:
      - ./valkey/data:/data

    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

    networks:
      voip-lan:
        ipv4_address: 192.168.31.57


  fs41:
      image: local/freeswitch:1.11.3
      container_name: fs41
      hostname: fs41
      restart: unless-stopped
      cap_add:
        - NET_ADMIN
      entrypoint:
        - /bin/sh
        - -c
        - |
          ip route add 10.77.0.1/32 via 192.168.31.30 dev eth0 || echo "WARN: failed to add route to 10.77.0.1" >&2
          exec /usr/local/bin/docker-entrypoint.sh "$@"
      environment:
        TZ: ${TZ}
        FS_ESL_LISTEN_IP: 0.0.0.0
        FS_SIP_PASSWORD: aicc@12345
      volumes:
        - ./fs41/conf:/usr/local/freeswitch/conf
        - ./fs41/log:/usr/local/freeswitch/log
        - ./fs41/recordings:/usr/local/freeswitch/recordings
      networks:
        voip-lan:
          ipv4_address: 192.168.31.41


  # --- ai-native-callcenter: one Go binary serving the API + SSE + SPA on 8080,
  # the AI-call SIP UAS on 6060/udp (RTP 40000-40999), ESL to fs41, the ledger
  # in the existing postgres. Dual-homed: voip-lan gives it 192.168.31.50 (the
  # SIP leg and the LAN view of the API), backend carries the host port
  # publishing and the helper services.
  aicc:
    image: aicc:v0.1.0
    container_name: aicc
    hostname: aicc
    restart: unless-stopped

    environment:
      TZ: ${TZ}
      AICC_ENV: prod
      # 8080 the API, the event stream and the SPA; 9090 metrics plus
      # healthz/readyz, opened on 0.0.0.0 so the healthcheck can reach it.
      AICC_HTTP_ADDR: ":8080"
      AICC_METRICS_ADDR: "0.0.0.0:9090"
      AICC_DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@192.168.31.56:5432/${POSTGRES_DB}?sslmode=disable"
      # fs41 speaks stock ESL: 8021/ClueCon (not the demo stack's 18021).
      AICC_ESL_ADDR: "192.168.31.41:8021"
      AICC_ESL_PASSWORD: ${FS_ESL_PASSWORD}
      AICC_SWITCH_DOMAIN: "192.168.31.41"
      AICC_SIP_PROFILE: internal
      # The reference flows' HTTP tools resolve against this base.
      AICC_BOT_BACKEND_BASE: "http://aicc-mockbackend:8770"
      # Recordings live in SeaweedFS over its S3 gateway (.51:8333); the
      # credentials are shared with seaweedfs/s3.json.
      AICC_RECORDING_BACKEND: S3
      AICC_S3_ENDPOINT: "192.168.31.51:8333"
      AICC_S3_ACCESS_KEY: ${AICC_S3_ACCESS_KEY}
      AICC_S3_SECRET_KEY: ${AICC_S3_SECRET_KEY}
      AICC_S3_BUCKET: aicc-recordings
      AICC_S3_SSL: "false"
      # Demo seed: accounts, queues, DIDs 95001/95002 and the published flow
      # behind them.
      AICC_SEED: demo

      # Which vendor answers every AI call in this deployment, resolved once at
      # startup. A call's language picks the greeting and the prompt language,
      # never the provider (phase1-decisions A1); the voice belongs to the flow,
      # not to the language. qwen is Aliyun's end-to-end realtime model on
      # DashScope, for this deployment inside mainland China; openai is OpenAI's
      # Realtime and answers everywhere else.
      AICC_PROVIDER: ${AICC_PROVIDER:-qwen}
      # Empty keeps the value built into the selected profile:
      #   qwen    wss://dashscope.aliyuncs.com/api-ws/v1/realtime
      #           qwen-audio-3.0-realtime-plus   (-flash selectable)
      #   openai  wss://api.openai.com/v1/realtime        gpt-realtime-2.1
      AICC_PROVIDER_ENDPOINT: ${AICC_PROVIDER_ENDPOINT:-}
      AICC_PROVIDER_MODEL: ${AICC_PROVIDER_MODEL:-}
      # The credential of whichever profile is selected: ALIYUN_API_KEY for
      # qwen, OPENAI_API_KEY for openai. Both pass through from the host
      # environment, so switching provider is an edit in this directory's .env
      # rather than in this file. An absent key does not stop the container; it
      # fails the AI leg when a call arrives, naming the variable it wanted.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ALIYUN_API_KEY: ${ALIYUN_API_KEY:-}
      # The self-contained chain instead — loadgen plus the in-repo mock
      # provider — needs AICC_PROVIDER=openai as well: the mock ignores
      # session.update and always sends 8 kHz µ-law, which only the openai
      # profile's G.711 passthrough reproduces faithfully. Its key is only
      # checked for being non-empty, so a placeholder will do.
      # AICC_PROVIDER_ENDPOINT: "ws://aicc-mockprovider:9099/v1/realtime"
      # OPENAI_API_KEY: not-a-key

    volumes:
      - ./aicc/logs:/var/log/aicc

    # No ports: this engine does not publish ports for containers on a
    # macvlan network; aicc-gateway proxies the host side of 8080/9090.
    healthcheck:
      test: ["CMD", "/usr/local/bin/docker-healthcheck", "-mode", "aicc"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 90s

    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

    networks:
      backend:
        ipv4_address: 172.18.0.50   # aicc-gateway proxies to this address
      voip-lan:
        ipv4_address: 192.168.31.50

  # The mock business backend the reference flows' HTTP tools call; in-memory
  # only, restart resets it.
  aicc-mockbackend:
    image: aicc:v0.1.0
    container_name: aicc-mockbackend
    hostname: aicc-mockbackend
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    entrypoint: ["/usr/local/bin/aicc-mockbackend"]
    command: ["-addr", "0.0.0.0:8770"]

    healthcheck:
      test: ["CMD", "/usr/local/bin/docker-healthcheck", "-mode", "tcp", "-addr", "127.0.0.1:8770"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

    networks:
      - backend

  # A Realtime-protocol voice provider for the verification and load harness:
  # point AICC_PROVIDER_ENDPOINT at it and AI calls run for free.
  aicc-mockprovider:
    image: aicc:v0.1.0
    container_name: aicc-mockprovider
    hostname: aicc-mockprovider
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    entrypoint: ["/usr/local/bin/aicc-mockprovider"]
    command: ["-addr", "0.0.0.0:9099"]

    healthcheck:
      test: ["CMD", "/usr/local/bin/docker-healthcheck", "-mode", "tcp", "-addr", "127.0.0.1:9099"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

    networks:
      - backend

  # The docker engine here does not publish ports for containers on the
  # macvlan network, so this bridge-attached nginx carries aicc's 8080
  # (API + SSE + SPA) and 9090 (metrics/health) to the host. Raw TCP pass-
  # through, so the event stream keeps its long-lived connections.
  aicc-gateway:
    image: nginx:alpine
    container_name: aicc-gateway
    hostname: aicc-gateway
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    volumes:
      - ./aicc-gateway/nginx.conf:/etc/nginx/nginx.conf:ro

    ports:
      - "8080:8080"            # aicc API + SSE + SPA on the host
      - "127.0.0.1:9090:9090"  # metrics + healthz/readyz, host-local only

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

    depends_on:
      aicc:
        condition: service_healthy

    networks:
      - backend

  # Object storage for recordings: master + volume + filer (8888, the switch
  # would PUT finished files here) + S3 gateway (8333, the application reads
  # here) in one process, data under ./seaweedfs-data. The S3 gateway demands
  # the credentials in ./seaweedfs/s3.json - the same pair aicc holds.
  seaweedfs:
    image: chrislusf/seaweedfs@sha256:fc9f76fa993ad69966ffeb2f65d0318fcae39c6f8e20cf68ef7b3a5cb97769e5
    container_name: seaweedfs
    hostname: seaweedfs
    restart: unless-stopped

    environment:
      TZ: ${TZ}

    command:
      - server
      - -dir=/data
      - -filer
      - -master.defaultReplication=000
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -ip=192.168.31.51
      - -ip.bind=0.0.0.0

    volumes:
      - ./seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8888/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

    networks:
      voip-lan:
        ipv4_address: 192.168.31.51


networks:
  backend:
    driver: bridge

  voip-lan:
    external: true
