      **先过闸门**:第 3 条的 total 必须 **> 0**。全 0 说明窗口里没有呼叫,此时五项
        "逐一相等"毫无信息量,判 **SKIP 而非 PASS**(2026-08-22 的教训)
      **abandonedCalls 的口径要特别核**:它数的是 missed_reason 落在三个 ABANDONED* 值里的行
