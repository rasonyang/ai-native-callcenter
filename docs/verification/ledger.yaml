# 验证账本(S1–S14)。只读分析产物;所有 collect 命令针对第 0 部分的 dev 环境:
#   app=/tmp/aicc(:8080,重启只用 deploy/dev/restart.sh)、DB=docker exec -i aicc-postgres、
#   FreeSWITCH=宿主原生(fs_cli)、ESL=127.0.0.1:18021、转写摄取 ws=127.0.0.1:8090。
#
# 通用约定(每条用例的 collect 假定已执行过下面几行登录;为省篇幅不逐条重复):
#   curl -s -c /tmp/vc-sup.jar -H 'Content-Type: application/json' -d '{"username":"supervisor","password":"aicc@12345"}' http://127.0.0.1:8080/api/v1/auth/login
#   curl -s -c /tmp/vc-wei.jar -H 'Content-Type: application/json' -d '{"username":"wei","password":"aicc@12345"}' http://127.0.0.1:8080/api/v1/auth/login
#   curl -s -c /tmp/vc-ben.jar -H 'Content-Type: application/json' -d '{"username":"ben","password":"aicc@12345"}' http://127.0.0.1:8080/api/v1/auth/login
#   curl -s -c /tmp/vc-admin.jar -H 'Content-Type: application/json' -d '{"username":"admin","password":"aicc@12345"}' http://127.0.0.1:8080/api/v1/auth/login
#     (admin 是 seed 账号,口令每次 seed 都被重置为该值——internal/seed/seed.go:42、:59、:203。
#      S14 的队列/号码/分机写操作需要它:三者同在一个 requireRole(auth.RoleAdmin) 组下
#      (internal/httpapi/server.go:205),主管会话一律 403 requiredRole=ADMIN。
#      其中队列启停一型已由 C23① 在 2026-08-21 live 实证,号码/分机两型目前是代码侧结论。)
#   写操作一律加:-H 'X-AICC-Csrf: 1'(internal/httpapi/middleware.go:21,:41)。
#   $LOG 指最新应用日志:LOG=$(ls -t logs/aicc-*.log | head -1)
#   fs_cli 不在本机 PATH(login shell 亦无):collect 一律写全路径 /usr/local/freeswitch/bin/fs_cli(审计 SYS-1)。
#   2026-08-20:审计修订 T0.1a/b 已应用(ledger-audit.md;owner 全批)——涉及 collect 命令、期望码 202、
#   基线差分、留证式条款、第 2 坐席 ben/1002。留证条款在 W1/W2 落地后由 T6.9 转正式断言。
#   2026-08-22:阶段 6 的 11 条草案(ledger-draft-phase6.md,commit 8321675)按原样并入,owner 已批准 ——
#     新场景 S13(坐席与主管旅程缺口)、S14(管理面生命周期 + 坐席外呼),另 VC-S12-04 并入既有 S12。
#     11 条全部 status: TODO,尚未执行。其 collect 已按阶段 2–5 的教训写:SSE 抓流 --max-time 1800、
#     事件计数用 grep -c '"type":"X"'(裸串会把一个事件数成两个)、会话按端点真实要求的角色选、
#     等 CDR 落库用轮询而非固定 sleep(C23①②③)。既有 28 条的 collect 尚未按此回修。
#     旅程缺口 G-C1(坐席账号全生命周期)仍未起草:它建号又删号,与 W9 的账号清理直接冲突,排 W9 之后。
#     ⚠ VC-S13-01 与 VC-S13-02 以 ben 为执行物料(ben 的队列配员、ben 的录音 01a02276-2a62-…),
#     W9 删账号必须等这两条执行完毕(TASKS.md 排序总则 3)。
#
# 环境事实核对(与任务第 0 部分的差异,采集时以 DB 为准):
#   - seed 将 wei 绑到分机 1001(internal/seed/seed.go:61);任务书写的是 1008。
#     每条涉及 wei 的用例先跑 collect 里的"读绑定分机"命令,以查询结果为准,不臆造。
#   - S8 的前提"en→OpenAI / zh→Qwen"与设计相反:一部署一 provider(phase1-decisions A1;
#     cmd/aicc/main.go:267-275 启动期解析一次)。VC-S8-* 按系统真实承诺改写:
#     language 只影响 flow 文案/voice/转写语言,不选 provider。
#   - S5 的 app 侧 RONA(RingNoAnswer)无调用方(死边,fsm-edges.md §3);
#     VC-S5-01 验证的是 mod_callcenter 的真实重排队行为 + app 侧"无痕"这一事实。
#
# ═══ 第 5 部分自检(逐项核对后打勾)═══
# [x] 四份清单中每一行都有证据等级标记([FACT]/[INFERENCE]/[ASSUMPTION])
# [x] 没有任何一行用推测填充位置(要么 file:line,要么 NOT FOUND;两处 [ASSUMPTION] 均附验证方法)
# [x] openapi.json 中的每个事件类型(SseEventType 33 值)都在 events.md 出现过
# [x] schema 中的每张表(00001–00013 全部 24 表 + 3 luacc 视图 + goose_db_version)都在 tables.md 出现过
# [x] internal/actor 不存在(NOT FOUND,已在 fsm-edges.md 首段声明);实际 actor 实现
#     (telephony party/call、agents presence、transcript actor、flow 阶段机、aicall 回合机)每条边都在 fsm-edges.md
# [x] fsm-edges.md 中 UNCOVERED 的边:DIALING→RELEASED→VC-S1-03;HELD→RELEASED→VC-S7-03;
#     非法迁移拒绝→VC-S4-02 日志断言;TALKING→ANSWER 自环→VC-S4-02 日志断言;
#     RingNoAnswer / ENDING / 转写 ENDED→已明确标注为死代码
# [x] ledger.yaml 中每个 human step 后都紧跟可粘贴的 collect 命令
# [x] 未修改任何源码 / schema / 配置文件(本轮仅新增 docs/verification/** 文件)

cases:

  # ───────────────────────── S1 入站 → DID → flow → bot 应答 ─────────────────────────

  - id: VC-S1-01
    scenario: S1
    layer: signaling
    precondition: "/tmp/aicc 已用 deploy/dev/restart.sh 启动;$LOG 含 'voice provider selected' 与 'ai voice leg listening';软电话(分机 1000 或外部 SIP)可拨 95001"
    steps:
      - who: human
        do: "用软电话拨 95001,听到 bot 开始说话后保持通话不挂断"
      - who: agent
        do: "在通话保持期间执行 collect,判定 bot 腿与主叫腿状态"
    collect:
      - "/usr/local/freeswitch/bin/fs_cli -x 'show channels' | cat"
      - "curl -s -b /tmp/vc-sup.jar http://127.0.0.1:8080/api/v1/calls | jq ."
      - "LOG=$(ls -t logs/aicc-*.log | head -1); grep -E 'ai conversation started|ai call bridged' \"$LOG\" | tail -5"
    expect: |
      fs_cli show channels:恰好 2 个通道 —— 主叫腿(dest 95001)+ 出向 bot 腿(sofia/gateway/aicc_bot/95001),均 state=CS_EXCHANGE_MEDIA
      GET /calls:恰好 1 个呼叫;state=RUNNING;language="en";parties 含 role=ORIGINATOR state=TALKING 的主叫腿与 isBotLeg=true 的 bot 腿
      $LOG 含一行 "ai conversation started" 且字段 provider=<AICC_PROVIDER 启动值> language=en flowId=<novanet 流 slug>
      $LOG 含 "ai call bridged" 且 law=PCMU 或 PCMA、isPassthrough 与 provider 匹配(openai=true)
    failure_looks_like: |
      show channels 有 2 个通道、caller 能听到 bot(一切"正常"),但 GET /calls 出现 2 个呼叫
      (minted 与 provisional 未合并,reidentify 失效)—— 界面与账本随后都按两通电话记,且无任何报错。
    evidence_dir: docs/verification/artifacts/VC-S1-01/
    status: PASS  # 2026-08-20 执行:2通道/单呼叫RUNNING/isBotLeg/两日志行全中;A腿CS_EXECUTE为桥内常态(verdict)
    refs: ["internal/telephony/coordinator.go:329", "internal/telephony/coordinator.go:297", "internal/aicall/orchestrator.go:207", "freeswitch/scripts/aicc_inbound.lua:56"]

  - id: VC-S1-02
    scenario: S1
    layer: app-state
    precondition: "紧接 VC-S1-01;通话仍在进行"
    steps:
      - who: human
        do: "对 bot 说一句可识别的话(如 what are your opening hours),等 bot 答完后挂断"
      - who: agent
        do: "执行 collect,判定 CDR 归属与转写落库"
    collect:
      - "sleep 3; docker exec -i aicc-postgres psql -U aicc -d aicc -Atc \"select call_id, call_type, status, is_contained, bot_sec, total_sec, did, language, hangup_cause from cdrs order by started_at desc limit 1\""
      - "CALL_ID=$(docker exec -i aicc-postgres psql -U aicc -d aicc -Atc \"select call_id from cdrs order by started_at desc limit 1\"); docker exec -i aicc-postgres psql -U aicc -d aicc -Atc \"select seq, speaker, kind, source, is_final is not null as x, left(content->>'text',40) from transcripts where call_id='$CALL_ID' order by seq\" 2>/dev/null || docker exec -i aicc-postgres psql -U aicc -d aicc -Atc \"select seq, speaker, kind, source, left(content->>'text',40) from transcripts where call_id='$CALL_ID' order by seq\""
      - "LOG=$(ls -t logs/aicc-*.log | head -1); grep -c 'caller leg ended, closing the model session' \"$LOG\""
      - "CALL_ID=$(docker exec -i aicc-postgres psql -U aicc -d aicc -Atc \"select call_id from cdrs order by started_at desc limit 1\"); docker exec -i aicc-postgres psql -U aicc -d aicc -Atc \"select count(*) from cdrs where call_id='$CALL_ID'\""
    expect: |
      cdrs 恰好新增 1 行,且同一 call_id 的 cdrs 行数 = 1(第 4 条):call_type=INBOUND,status=ANSWERED,
      bot_sec>0,did=95001,language=en,is_contained=false(主叫先挂,非 bot 收线),hangup_cause=NORMAL_CLEARING
      transcripts 该 call_id 至少 1 行:speaker=BOT(kind=TEXT,source=MODEL),seq 从 1 起连续无洞
      【留证,不判定】CUSTOMER 行数落档 evidence_dir(当前实现应为 0:stock profile 未设 TranscribeModel、
      ASR tap 只挂坐席腿——审计 SYS-8;若 >0 记录为实现变化,不作为 FAIL;W1 落地后转正式断言 CUSTOMER|MODEL ≥1)
      日志计数 ≥1(watchLeg 收到主叫挂断)
    failure_looks_like: |
      cdrs 出现同一通话的 2 行(bot 侧与人侧都写了)—— 归属规则 cdr.go:79 被绕过;
      或 transcripts 的 seq 有洞(空 final 烧号回归,actor.go:222 防线失效)。两者对呼叫者都不可见。
    evidence_dir: docs/verification/artifacts/VC-S1-02/
    status: PASS  # 2026-08-20 执行:单行CDR(bot_sec=125)/BOT行seq1-10连续/留证CUSTOMER=0与SYS-8一致
    refs: ["internal/aicall/ledger.go:130", "internal/telephony/cdr.go:79", "internal/transcript/actor.go:222", "internal/aicall/session.go:728"]

  - id: VC-S1-03
    scenario: S1
    layer: signaling
    precondition: "app 运行中;95999 不在 dids 表(collect 第 1 条先证实)"
    steps:
      - who: agent
        do: "确认 95999 未配置并记录基线:执行 collect 第 1、2 条(第 1 条须返回 0)"
      - who: human
        do: "用软电话拨 95999,听到忙音/挂断即可(呼叫不会被应答)"
      - who: agent
        do: "执行其余 collect,判定未应答腿的 DIALING→RELEASED 边"
    collect:
      - "docker exec -i aicc-postgres psql -U aicc -d aicc -Atc \"select count(*) from dids where number='95999'\""
      - "LOG=$(ls -t logs/aicc-*.log | head -1); echo baseline_rejects=$(grep -c 'rejected party transition' \"$LOG\"); echo baseline_cdrs=$(docker exec -i aicc-postgres psql -U aicc -d aicc -Atc 'select count(*) from cdrs')"
      - "LOG=$(ls -t logs/aicc-*.log | head -1); echo rejects_now=$(grep -c 'rejected party transition' \"$LOG\"); echo cdrs_now=$(docker exec -i aicc-postgres psql -U aicc -d aicc -Atc 'select count(*) from cdrs')"
      - "docker exec -i aicc-postgres psql -U aicc -d aicc -Atc \"select status, hangup_cause, answered_at is null as never_answered from cdrs order by started_at desc limit 1\""
      - "/usr/local/freeswitch/bin/fs_cli -x 'console last 100' | grep aicc_inbound | tail -3"
    expect: |
      第 1 条 = 0
      cdrs_now = baseline_cdrs + 1(被拒话务入账);cdrs 最新行:status=NO_ANSWER,never_answered=t,
      hangup_cause=UNALLOCATED_NUMBER
      rejects_now = baseline_rejects(无新增;DIALING→RELEASE 是合法边,call.go:69)
      FS console 含 aicc_inbound: "unknown number 95999"
    failure_looks_like: |
      呼叫被拒(人听到忙音,表面正确),但 cdrs 里根本没有行 —— 未应答的 provisional 呼叫
      在 Finish 后没走 InsertCDR,漏记了被拒话务;或者出现 "rejected party transition"
      (状态机把合法的未接释放当非法迁移吞掉)。
    evidence_dir: docs/verification/artifacts/VC-S1-03/
    status: PASS  # 2026-08-20 执行:链路重试6次↔6行CDR全部UNALLOCATED_NUMBER入账;rejects差分0;console缓冲不可靠改查日志文件(verdict)
    refs: ["freeswitch/scripts/aicc_inbound.lua:47", "internal/telephony/call.go:69", "internal/telephony/cdr.go:229"]

  # ───────────────────────── S2 bot 交互中主叫挂断 ─────────────────────────

  - id: VC-S2-01
    scenario: S2
    layer: media
    precondition: "app 运行中;95001 可达(VC-S1-01 已通过)"
    steps:
      - who: agent
        do: "记录基线:执行 collect 第 1 条"
      - who: human
        do: "拨 95001,在 bot 说话说到一半时挂断(卡在句子中间)"
      - who: agent
        do: "执行其余 collect,判定双向拆线与资源回收"
    collect:
      - "LOG=$(ls -t logs/aicc-*.log | head -1); echo baseline_mailbox=$(grep -c 'transcript mailbox full' \"$LOG\")"
      - "sleep 3; LOG=$(ls -t logs/aicc-*.log | head -1); grep -E 'caller leg ended|model session closed|ai call failed' \"$LOG\" | tail -5"
      - "/usr/local/freeswitch/bin/fs_cli -x 'show channels count'"
      - "docker exec -i aicc-postgres psql -U aicc -d aicc -Atc \"select status, is_contained, bot_sec, hangup_cause from cdrs order by started_at desc limit 1\""
      - "LOG=$(ls -t logs/aicc-*.log | head -1); echo mailbox_now=$(grep -c 'transcript mailbox full' \"$LOG\")"
    expect: |
      日志顺序出现 "caller leg ended, closing the model session";无 "ai call failed"
      show channels count = 0 total
      cdrs 最新行:status=ANSWERED(bot 接了),is_contained=false,bot_sec ≥1,hangup_cause=NORMAL_CLEARING
      mailbox_now = baseline_mailbox(无新增)
    failure_looks_like: |
      主叫已挂、channels=0(表面干净),但日志没有 "model session closed" —— provider WebSocket
      仍挂着计费;或 cdrs.is_contained=true(把主叫弃线记成 bot 圆满收线,污染 containment 指标)。
    evidence_dir: docs/verification/artifacts/VC-S2-01/
    status: PASS  # 2026-08-20 执行:拆线链/channels=0/is_contained=f/bot_sec=4;"model session closed"缺席是主叫先挂路径常态(verdict有叙述修订建议)
    refs: ["internal/aicall/session.go:728", "internal/aicall/session.go:288", "internal/aicall/ledger.go:175", "internal/aicall/orchestrator.go:187"]

  # ───────────────────────── S3 bot → 队列转人工(与 mod_callcenter 对账) ─────────────────────────

  - id: VC-S3-01
    scenario: S3
    layer: signaling
    precondition: "wei 已签入且 READY(collect 前 2 条先证实并可代做);队列 support-en 空"
    steps:
      - who: agent
        do: "读 wei 的绑定分机、签入并置 READY(可脚本化,无需人):执行 collect 第 1–3 条"
      - who: agent
        do: "开启 SSE 抓流(90 秒窗口):执行 collect 第 4 条"
      - who: human
        do: "拨 95001,对 bot 说 I need to talk to a human agent,等听到转接提示音/保持音后不要挂断"
      - who: agent
        do: "执行其余 collect,判定入队三事件与等待名单"
    collect:
      - "docker exec -i aicc-postgres psql -U aicc -d aicc -Atc \"select e.number from agents a join users u on u.id=a.user_id join extensions e on e.id=a.default_extension_id where u.username='wei'\""
      - "curl -s -b /tmp/vc-wei.jar -H 'X-AICC-Csrf: 1' -H 'Content-Type: application/json' -X POST http://127.0.0.1:8080/api/v1/agent/login -d '{}' | jq -c '.state // .error.code'"
      - "curl -s -b /tmp/vc-wei.jar -H 'X-AICC-Csrf: 1' -X POST http://127.0.0.1:8080/api/v1/agent/ready | jq -c ."
      - "curl -s -N --max-time 90 -b /tmp/vc-sup.jar http://127.0.0.1:8080/api/v1/events > /tmp/vc-s3-sse.log 2>&1 &"
      - "sleep 2; FS=/usr/local/freeswitch/bin/fs_cli; QN=$($FS -x 'callcenter_config queue list' | awk -F'|' '/^support-en@/{print $1; exit}'); echo QN=$QN; $FS -x \"callcenter_config queue list members $QN\""
      - "curl -s -b /tmp/vc-sup.jar http://127.0.0.1:8080/api/v1/calls/waiting | jq ."
      - "grep -E 'QUEUE_JOINED|QUEUE_COUNT|QUEUE_AGENT_OFFERED' /tmp/vc-s3-sse.log | head -6"
    expect: |
      第 1 条返回一个分机号(live 当前为 1008;以查询结果为准,后续用例引用它)
      第 2 条 login 返回 state=NOT_READY(已签入则 AGENT_ALREADY_LOGGED_IN 亦可)
      queue list members:恰好 1 行,state=Trying 或 Waiting,cid_number=主叫号码
      GET /calls/waiting:items 恰好 1 项,queueName="support-en",fromNumber=主叫号码,slaThresholdSec=队列配置值
      SSE 日志:QUEUE_JOINED 1 条(payload.queueName="support-en")→ QUEUE_COUNT 1 条(payload.waiting=1)
      → wei READY 时应随后出现 QUEUE_AGENT_OFFERED(agentId=wei 的 agentId)
    failure_looks_like: |
      mod_callcenter members 里有 1 行(交换机侧在排队,主叫听着保持音,一切"正常"),
      但 GET /calls/waiting 为空 —— QueueCatalog 未接上或队列名不匹配(waiting.go:199-205
      直接 return),坐席屏幕永远看不到这个等待者,且两侧都不报错。
    evidence_dir: docs/verification/artifacts/VC-S3-01/
    status: PASS  # 2026-08-20 执行:members Trying/waiting 1项/SSE三连全中;发现 /calls/waiting 拒绝sup(C12),以wei jar代采;F1已闭(verdict)
    refs: ["internal/aicall/actions.go:55", "internal/telephony/waiting.go:198", "internal/telephony/coordinator.go:568", "freeswitch/scripts/aicc_queue.lua:66"]

  - id: VC-S3-02
    scenario: S3
    layer: app-state
    precondition: "app 运行中;至少 wei 已签入(其余坐席状态任意)。纯脚本用例,无人工步骤"
    steps:
      - who: agent
        do: "对账:DB 期望配员(已签入坐席) vs mod_callcenter tier 现实,执行 collect 并逐行 diff"
    collect:
      - "docker exec -i aicc-postgres psql -U aicc -d aicc -Atc \"select a.callcenter_name || '|' || q.name from queue_agents qa join agents a on a.id=qa.agent_id join queues q on q.id=qa.queue_id join agent_states s on s.agent_id=a.id where s.state <> 'LOGGED_OUT' order by 1\""
      - "/usr/local/freeswitch/bin/fs_cli -x 'callcenter_config tier list' | awk -F'|' 'NR>1 && NF>=5 {split($1,q,\"@\"); print $2 \"|\" q[1]}' | sort"
      - "/usr/local/freeswitch/bin/fs_cli -x 'callcenter_config agent list' | grep -E 'agent-' | cat"
    expect: |
      第 1 条(DB 期望)与第 2 条(switch 现实)输出逐行完全一致(diff 为空),例如都含:
      agent-wei|support-en
      agent list:每个已签入坐席一行,status 与 DB 状态映射一致(READY→Available,NOT_READY→On Break;state.go:219-227),
      contact 含其绑定分机号
    failure_looks_like: |
      switch 上存在 DB 没有的 tier(如坐席被撤出队列时人在签出态,DeleteCallcenterTier 从未执行)——
      该坐席会继续接到已被撤销队列的来电;tier list 与 DB 各自"正常",只有 diff 能暴露。
      反向:DB 有、switch 无(mod_callcenter 重启后 SyncTiers 未跑)—— 坐席 Available 却永远接不到呼叫。
