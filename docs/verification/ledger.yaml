  # ───────────────────────── S15 事件流的名字与作用域(T6.10,2026-08-25 起草) ─────────────────────────
  #
  # 事件流是本产品唯一没有编译器的接口:少发一条、发错一个名字、发早发晚,
  # 代码照跑、单测照绿。本节的两条是给那些**没有既有挂点**的类型准备的;
  # 其余六个已挂进 VC-S1-01(BOT_SESSION_STARTED)、VC-S4-04(CALL_RECORDING_*)、
  # VC-S12-03(SYSTEM_LINK)、VC-S13-05(DEVICE_REGISTERED/UNREGISTERED)。

  - id: VC-S15-01
    scenario: S15
    layer: api
    precondition: "wei 已签入 READY 且在一通进行中的电话上(任意一型皆可,内部呼叫最省事);/tmp/vc-wei.jar 与 /tmp/vc-sup.jar 均有效"
    steps:
      - who: agent
        do: "开抓流并记下 callId:执行 collect 第 1、2 条"
      - who: agent
        do: "对同一通电话连打三次 PATCH:一次写入两个键、一次把其中一个设成**它已有的值**、一次删一个键。执行 collect 第 3–5 条"
      - who: agent
        do: "判定:执行其余 collect"
    collect:
      - "curl -s -N --max-time 600 -b /tmp/vc-sup.jar http://127.0.0.1:8080/api/v1/events > /tmp/vc-s15-sse.log 2>&1 &"
      - "CID=$(curl -s -b /tmp/vc-wei.jar http://127.0.0.1:8080/api/v1/calls/mine | jq -r '.items[0].callId'); echo \"$CID\" > /tmp/vc-s15-callid; echo \"$CID\""
      - "CID=$(cat /tmp/vc-s15-callid); curl -s -o /dev/null -w '%{http_code}\\n' -b /tmp/vc-wei.jar -H 'X-AICC-Csrf: 1' -H 'Content-Type: application/json' -X PATCH http://127.0.0.1:8080/api/v1/calls/$CID/user-data -d '{\"userData\":{\"orderId\":\"A-4471\",\"ticketId\":\"T-9\"}}'"
      - "CID=$(cat /tmp/vc-s15-callid); curl -s -b /tmp/vc-wei.jar -H 'X-AICC-Csrf: 1' -H 'Content-Type: application/json' -X PATCH http://127.0.0.1:8080/api/v1/calls/$CID/user-data -d '{\"userData\":{\"orderId\":\"A-4471\"}}' | jq -c '{changedKeys,deletedKeys}'"
      - "CID=$(cat /tmp/vc-s15-callid); curl -s -b /tmp/vc-wei.jar -H 'X-AICC-Csrf: 1' -H 'Content-Type: application/json' -X PATCH http://127.0.0.1:8080/api/v1/calls/$CID/user-data -d '{\"userData\":{\"ticketId\":null}}' | jq -c '{userData,changedKeys,deletedKeys}'"
      - "grep -c '\"type\":\"CALL_USER_DATA\"' /tmp/vc-s15-sse.log; grep -A1 '^event: CALL_USER_DATA' /tmp/vc-s15-sse.log | grep '^data:' | jq -c '{payload,userData}'"
      - "CID=$(cat /tmp/vc-s15-callid); docker exec -i aicc-postgres psql -U aicc -d aicc -Atc \"select user_data from cdrs where call_id='$CID'\"   # 挂断后再执行"
    expect: |
      三次 PATCH 分别 200/200/200。
      第二次(把 orderId 设成它已有的值)回 changedKeys=[] deletedKeys=[] ——
        **设成原值不算变更**;这不是小事:协商转接常常把同一份数据原样并回来,
        照发的话每一次协商都会报出一个没人做过的变更。
      第三次回 userData 只剩 orderId,deletedKeys=["ticketId"]。
      **SSE 恰好 2 条 CALL_USER_DATA,不是 3 条** —— 中间那次什么都没动,所以什么都不说。
      载荷只有 changedKeys / deletedKeys,**不带数据本身**:信封的 userData 已经带着整张结果表
      (每条通话事件都带),载荷只说哪几个键动了,屏幕不必自己 diff。
      作用域是**整通电话**(publish 时不带 party):业务数据是关于这通对话的,不是关于某条腿的
      —— 这正是"腿事件私有于其坐席"那条指令的两个既定例外之一。
      挂断后 cdrs.user_data = {"orderId":"A-4471"}。
    failure_looks_like: |
      三条 CALL_USER_DATA 而不是两条 —— 一次没人做过的变更被宣告了出去。
      订阅方从此分不出"这真的变了"和"有人想让我重查",而 PARTY_* 载荷里的 state
      也就跟着变成一句可疑的话:事件流从"发生了什么的记录"降级成轮询触发器。
      代码照跑、单测照绿,没有任何东西会红。
    evidence_dir: docs/verification/artifacts/VC-S15-01/
    status: PASS  # 2026-08-25 执行(真人工内部呼叫 1008→1002,通话中连打五次 PATCH)。核心断言成立:**SSE 恰好 2 条 CALL_USER_DATA,不是 5 条** —— 把 orderId 设成它已有的值回 changedKeys=[] deletedKeys=[]、删不存在的键同样两空,两次都没有发出任何事件;载荷只有 changedKeys/deletedKeys 而信封带整张 userData;挂断后 cdrs.user_data={"orderId":"A-4471"}。⚠ **同时抓出一处契约违规并当场修掉**:载荷里的两个列表是 nil slice,编码成 `"deletedKeys":null`,而契约把它们标为 required 的数组 —— 客户端 `for (const k of payload.deletedKeys)` 会炸。HTTP 响应从一开始就有 emptyIfNil 这道闸,**事件没有**。已加 orEmpty 并补断言。**那条断言第一版也是错的**:它断在 `ev.Payload["deletedKeys"].([]string)` 上,而 nil []string 的类型断言照样成立、长度也是 0 —— 差别只在 JSON 编码之后。改成 marshal 后断 `"deletedKeys":[]`,突变(去掉 orEmpty)才终于变红。**又一次"断在内存值上而不是断在线上"**,与 escapeOriginateValue 那次同型
