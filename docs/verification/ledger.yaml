    refs: ["internal/agents/state.go:207", "internal/agents/state.go:219-232", "internal/agents/service.go:394-413", "internal/events/event.go:57"]
    note: "【2026-08-22 已落实,结论:没有那次调用 —— 见 C28①。以下为起草时原文,留档】
      【执行前须落实】switch 侧那条断言(agent-wei 不再 Available)对应哪次镜像调用尚未静态确认——
