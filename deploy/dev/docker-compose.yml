# Dev infrastructure for ai-native-callcenter.
# PostgreSQL runs here (never via host package managers); FreeSWITCH runs natively on the host.
# The full demo environment (app + FreeSWITCH + seed) lives in deploy/demo/ (M5).
services:
  postgres:
    image: postgres:18
    container_name: aicc-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: aicc
      POSTGRES_PASSWORD: aicc
      POSTGRES_DB: aicc
    volumes:
      # postgres:18 images mount the volume at /var/lib/postgresql (PGDATA lives beneath it)
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicc -d aicc"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Object storage for recordings: one SeaweedFS process (master, volume,
  # filer, S3 gateway). The native FreeSWITCH writes recordings straight into
  # it through mod_http_cache (HTTP PUT against the filer, port 8888), and the
  # application reads them back over the S3 API (port 8333). The filer path
  # /buckets/aicc-recordings and the S3 bucket aicc-recordings are the same
  # files seen through two doors.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: aicc-seaweedfs
    restart: unless-stopped
    command: mini -dir=/data -bucket=aicc-recordings
    ports:
      - "127.0.0.1:8888:8888"   # filer — mod_http_cache PUTs/GETs here
      - "127.0.0.1:8333:8333"   # S3 — the application reads here
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8888/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  seaweedfs-data:
