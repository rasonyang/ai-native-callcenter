# SPDX-License-Identifier: Apache-2.0
#
# The whole product on one machine: PostgreSQL, FreeSWITCH and the application,
# seeded with a team, two queues, a published bilingual flow and a week of
# history. One command from a clone to a call.
#
#   cd deploy/demo && cp .env.example .env && docker-compose up -d
#
# Everything talks over the compose network, so an AI call — number, dialplan,
# gateway, SIP UAS, RTP — never leaves the host. Only the screens (8080) and
# the SIP ports a real softphone needs are published.
#
# This is a demo, not a deployment: the passwords below are printed in the
# README. Read deploy/README.md before putting any of it on a shared network.
name: aicc-demo

services:
  postgres:
    image: postgres:18
    container_name: aicc-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aicc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aicc}
      POSTGRES_DB: aicc
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicc -d aicc"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The application. Builds from the repository root by default; point
  # AICC_IMAGE at a published tag to skip the build.
  aicc:
    image: ${AICC_IMAGE:-aicc:demo}
    build:
      context: ../..
      args:
        VERSION: ${AICC_VERSION:-demo}
    container_name: aicc-demo-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AICC_ENV: prod
      AICC_DATABASE_URL: postgres://aicc:${POSTGRES_PASSWORD:-aicc}@postgres:5432/aicc?sslmode=disable

      # The switch is a container away, not a socket away.
      AICC_ESL_ADDR: freeswitch:18021
      AICC_ESL_PASSWORD: ${ESL_PASSWORD:-ClueCon}
      # Must equal FreeSWITCH's own $${domain}: queue names are rendered with
      # it on both sides and mod_callcenter matches them literally.
      AICC_SWITCH_DOMAIN: ${SWITCH_DOMAIN:-aicc.demo}

      # The gateway dials this container by name; the SDP address is probed
      # toward the peer, which on a compose network is this container's own.
      AICC_BOT_SIP_HOST: 0.0.0.0
      AICC_BOT_SIP_PORT: "6060"

      AICC_PROVIDER: ${AICC_PROVIDER:-openai}
      AICC_PROVIDER_ENDPOINT: ${AICC_PROVIDER_ENDPOINT:-}
      AICC_PROVIDER_MODEL: ${AICC_PROVIDER_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ALIYUN_API_KEY: ${ALIYUN_API_KEY:-}

      # The switch records into the shared volume; the application serves what
      # it finds there.
      AICC_RECORDING_DIR: /recordings
      AICC_RECORDING_BACKEND: FS

      # demo seeds; fresh clears the demo back out again. See the README.
      AICC_SEED: ${AICC_SEED:-demo}

      # Metrics and health have no authentication of their own, so they are
      # opened onto the compose network only — no published port.
      AICC_METRICS_ADDR: :9090
      AICC_LOG_LEVEL: ${AICC_LOG_LEVEL:-info}
    # The switch writes recordings as its own user into directories it creates
    # 0750, so reading them takes membership of its group rather than a mode
    # change on every new day's folder. 499 is the freeswitch group in the
    # pinned image below.
    group_add:
      - "499"
    volumes:
      - recordings:/recordings:ro
      - app-logs:/var/log/aicc
    ports:
      - "${HTTP_BIND:-127.0.0.1}:8080:8080"

  # Creates the confined role the switch reads the luacc views with. It waits
  # for the application to have migrated, because the views are what it grants
  # on, and then exits — FreeSWITCH starts once it has succeeded.
  lua-role:
    image: postgres:18
    container_name: aicc-demo-lua-role
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      aicc:
        condition: service_started
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-aicc}
      LUA_PASSWORD: ${LUA_PASSWORD:-aicc-lua}
    volumes:
      - ./postgres/lua-role.sh:/lua-role.sh:ro
      - ../sql/lua_role.sql:/lua_role.sql:ro
    entrypoint: ["/bin/bash", "/lua-role.sh"]

  freeswitch:
    image: dheaps/freeswitch@sha256:06798d776f557f9ae6e03c370b8e110046c6a0af9bd0e6536a80ca2c18467e34
    container_name: aicc-demo-freeswitch
    restart: unless-stopped
    depends_on:
      lua-role:
        condition: service_completed_successfully
    environment:
      AICC_DB_HOST: postgres
      AICC_DB_PASSWORD: ${POSTGRES_PASSWORD:-aicc}
      AICC_LUA_PASSWORD: ${LUA_PASSWORD:-aicc-lua}
      AICC_BOT_HOST: aicc
      AICC_BOT_PORT: "6060"
      AICC_DOMAIN: ${SWITCH_DOMAIN:-aicc.demo}
      AICC_ESL_PASSWORD: ${ESL_PASSWORD:-ClueCon}
      # Set to the host's LAN address to let a softphone outside this machine
      # register and hear audio; empty keeps the demo self-contained.
      AICC_EXTERNAL_IP: ${FS_EXTERNAL_IP:-}
      # Prompt and music files are a 100MB download, off by default. The demo
      # needs none of them; queue music does.
      SOUND_RATES: ${FS_SOUND_RATES:-}
      SOUND_TYPES: ${FS_SOUND_TYPES:-}
    volumes:
      # Our half of the switch's configuration, applied over the stock one at
      # every boot by the entrypoint hook.
      - ./freeswitch/entrypoint.d:/docker-entrypoint.d:ro
      - ./freeswitch/conf:/aicc/conf:ro
      - ../../freeswitch:/aicc/src:ro
      - freeswitch-conf:/etc/freeswitch
      - recordings:/var/lib/freeswitch/recordings
    ports:
      # SIP for a real softphone: UDP/TCP signalling, and the WebSocket
      # transport the browser phone uses.
      - "${SIP_BIND:-127.0.0.1}:5060:5060/udp"
      - "${SIP_BIND:-127.0.0.1}:5060:5060/tcp"
      - "${SIP_BIND:-127.0.0.1}:5066:5066/tcp"
      - "${SIP_BIND:-127.0.0.1}:7443:7443/tcp"
      # Media for a phone outside this machine is deliberately not published:
      # a port range costs one proxy process per port, and the demo's own
      # calls never leave the compose network. Uncomment this line and set
      # FS_EXTERNAL_IP to hear audio on a real softphone.
      # - "${SIP_BIND:-127.0.0.1}:16384-16424:16384-16424/udp"

volumes:
  postgres-data:
  freeswitch-conf:
  recordings:
  app-logs:
