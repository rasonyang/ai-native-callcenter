# SPDX-License-Identifier: Apache-2.0
#
# Cutting a release: one executable per platform, and one container image.
#
#   git tag -a v0.1.0 -m "…" && git push origin v0.1.0
#
# The executable carries the SPA inside it, so every archive here is the whole
# product — no assets to unpack beside it, nothing to serve it with.
#
# Tags: a release publishes the image under the exact git tag and nothing else —
# `ghcr.io/<owner>/<repo>:v0.1.0`. No `latest`, no floating `0.1`, no v-stripped
# alias: a deployment names the build it runs, and a tag that moves cannot be
# named. A `workflow_dispatch` run builds the image but pushes nothing.
#
# Pre-releases: a tag whose name contains a hyphen (`v0.1.0-rc.1`) is marked as a
# pre-release on GitHub; a plain `v0.1.0` is a full release.
#
# Notes: the release body comes from `scripts/release-notes.sh <tag>` — the
# CHANGELOG.md section for the tag when there is one, otherwise the commit
# subjects since the previous tag.
name: release

on:
  push:
    tags: ["v*"]
  # A dry run against any commit: builds and uploads nothing.
  workflow_dispatch:

permissions:
  contents: write   # creating the release
  packages: write   # pushing to ghcr.io

jobs:
  # Built once and handed to every platform: the frontend is architecture
  # independent, and four identical npm builds would only be four chances to
  # differ.
  spa:
    name: spa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: spa
          path: web/dist
          retention-days: 1

  binaries:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: spa
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: spa
          path: web/dist

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = tag ] || version="$(git rev-parse --short HEAD)"
          echo "version=${version}" >> "$GITHUB_ENV"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o aicc ./cmd/aicc

      # The runner is linux/amd64, so exactly one matrix entry produces an
      # executable it can run — and that one has to prove the ldflags landed.
      # An archive that cannot say which build it is cannot be supported.
      - name: Check the stamped version
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          out="$(./aicc --version)"
          echo "$out"
          case "$out" in
            *"aicc ${version} "*) ;;
            *) echo "::error::--version does not carry ${version}: ${out}"; exit 1 ;;
          esac

      - name: Package
        run: |
          name="aicc_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/$name"
          cp aicc LICENSE NOTICE README.md ".env.example" "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz*
          retention-days: 1

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # The exact tag, and only that. `type=sha` gives a dispatch run
          # something to label the image it builds and never pushes.
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,enable=${{ github.ref_type != 'tag' }}

      # The image builds the SPA itself, so it does not take the artifact
      # above: one Dockerfile, one way to build it, wherever it is built.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: publish
    needs: [binaries, image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      # The notes are written from the history between two tags, so this
      # checkout needs all of it — and the tags themselves.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist

      - name: Release notes
        run: scripts/release-notes.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          # A hyphen in the tag is a pre-release: v0.1.0-rc.1, v0.2.0-beta.2.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
