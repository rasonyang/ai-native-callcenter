# SPDX-License-Identifier: Apache-2.0
#
# Cutting a release: one container image, and that is the release.
#
#   git tag -a v0.1.0 -m "…" && git push origin v0.1.0
#
# The image carries the executable with the SPA embedded in it and nothing else
# — no web server, no interpreter, no assets to unpack beside it. A deployment
# names it in `AICC_IMAGE` and pulls; `deploy/README.md` is that procedure.
#
# Tags: a release publishes the image under the exact git tag and nothing else —
# `rasonyang/ai-native-callcenter:v0.1.0`. No `latest`, no floating `0.1`, no
# v-stripped alias: a deployment names the build it runs, and a tag that moves
# cannot be named. A `workflow_dispatch` run builds the image but pushes nothing.
#
# Credentials: the image goes to Docker Hub, beside `rasonyang/freeswitch-aicc`,
# so the repository needs `DOCKERHUB_USERNAME` and `DOCKERHUB_TOKEN` (an access
# token with Read & Write, not the account password) as secrets. Without them a
# tag build fails at the login step rather than pushing nothing quietly.
#
# Pre-releases: a tag whose name contains a hyphen (`v0.1.0-rc.1`) is marked as a
# pre-release on GitHub; a plain `v0.1.0` is a full release.
#
# Notes: the release body comes from `scripts/release-notes.sh <tag>` — the
# CHANGELOG.md section for the tag when there is one, otherwise the commit
# subjects since the previous tag.
name: release

on:
  push:
    tags: ["v*"]
  # A dry run against any commit: builds and pushes nothing.
  workflow_dispatch:

permissions:
  contents: write   # creating the release

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: rasonyang/ai-native-callcenter
          # The exact tag, and only that. `type=sha` gives a dispatch run
          # something to label the image it builds and never pushes.
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,enable=${{ github.ref_type != 'tag' }}

      # One architecture, loaded into the runner's own daemon, so that the
      # image can be run before it is pushed: an image that cannot say which
      # build it is cannot be supported. The multi-arch build below is the same
      # Dockerfile against the same cache, so this costs a copy, not a build.
      - name: Build linux/amd64 for the version check
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: aicc:version-check
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the stamped version
        run: |
          out="$(docker run --rm aicc:version-check --version)"
          echo "$out"
          case "$out" in
            *"aicc ${GITHUB_REF_NAME} "*) ;;
            *) echo "::error::--version does not carry ${GITHUB_REF_NAME}: ${out}"; exit 1 ;;
          esac

      # The image builds the SPA itself, so there is no artifact to hand it:
      # one Dockerfile, one way to build it, wherever it is built.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: publish
    needs: [image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      # The notes are written from the history between two tags, so this
      # checkout needs all of it — and the tags themselves.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Release notes
        run: scripts/release-notes.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"

      # No files: the release is the image, and this is the note that names it.
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          # A hyphen in the tag is a pre-release: v0.1.0-rc.1, v0.2.0-beta.2.
          prerelease: ${{ contains(github.ref_name, '-') }}
