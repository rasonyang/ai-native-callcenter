# SPDX-License-Identifier: Apache-2.0
#
# Cutting a release: one executable per platform, and one container image.
#
#   git tag -a v0.1.0 -m "…" && git push origin v0.1.0
#
# The executable carries the SPA inside it, so every archive here is the whole
# product — no assets to unpack beside it, nothing to serve it with.
name: release

on:
  push:
    tags: ["v*"]
  # A dry run against any commit: builds and uploads nothing.
  workflow_dispatch:

permissions:
  contents: write   # creating the release
  packages: write   # pushing to ghcr.io

jobs:
  # Built once and handed to every platform: the frontend is architecture
  # independent, and four identical npm builds would only be four chances to
  # differ.
  spa:
    name: spa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: spa
          path: web/dist
          retention-days: 1

  binaries:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: spa
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: spa
          path: web/dist

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = tag ] || version="$(git rev-parse --short HEAD)"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o aicc ./cmd/aicc
          ./aicc version || true   # a cross build cannot run; native ones say hello

      - name: Package
        run: |
          name="aicc_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/$name"
          cp aicc LICENSE README.md ".env.example" "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz*
          retention-days: 1

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      # The image builds the SPA itself, so it does not take the artifact
      # above: one Dockerfile, one way to build it, wherever it is built.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: publish
    needs: [binaries, image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
