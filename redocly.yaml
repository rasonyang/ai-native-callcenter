# Redocly CLI configuration for the API contract lint (make api-lint).
# Rules start from the recommended set; known exceptions live in
# .redocly.lint-ignore.yaml (the SSE payload schemas, which are linked by
# naming convention rather than $ref because OpenAPI cannot express
# per-event-type SSE payloads).
extends:
  - recommended
rules:
  no-invalid-schema-examples: error
  # Recommended lints media-type examples at warn; the operations integrators
  # meet first now carry them, so an example that drifts from its schema must
  # fail the lint, not pass with a notice nobody reads.
  no-invalid-media-type-examples: error
